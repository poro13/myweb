<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>과제 바로가기</title>

    <style>
        /* 전체 기본 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Pretendard", "Noto Sans KR", sans-serif;

            background:
                radial-gradient(circle at 15% 20%, #dff7ff 0, transparent 30%),
                radial-gradient(circle at 85% 80%, #ffe5ef 0, transparent 30%),
                linear-gradient(135deg, #f6fbff, #fff8fc);

            color: #333;

            overflow: hidden;
        }


        /* 배경 장식 */
        .circle {
            position: absolute;

            border-radius: 50%;

            filter: blur(5px);

            opacity: 0.4;

            animation: float 6s ease-in-out infinite;
        }

        .circle1 {
            width: 180px;
            height: 180px;

            background-color: #a9dcff;

            top: -50px;
            left: -40px;
        }

        .circle2 {
            width: 230px;
            height: 230px;

            background-color: #ffc6dd;

            right: -70px;
            bottom: -70px;

            animation-delay: 1.5s;
        }

        .circle3 {
            width: 100px;
            height: 100px;

            background-color: #d8c9ff;

            top: 12%;
            right: 12%;

            animation-delay: 3s;
        }


        /* 전체 영역 */
        .container {
            width: 90%;
            max-width: 1050px;

            position: relative;

            z-index: 1;
        }


        /* 제목 영역 */
        .title-area {
            text-align: center;

            margin-bottom: 55px;
        }

        .title-area p {
            font-size: 15px;

            color: #8a8a9b;

            letter-spacing: 3px;

            margin-bottom: 10px;
        }

        .title-area h1 {
            font-size: 42px;

            color: #333747;

            margin-bottom: 12px;
        }

        .title-area .description {
            font-size: 16px;

            color: #888;

            letter-spacing: 0;
        }


        /* 과제 카드 영역 */
        .assignment-list {
            display: flex;

            justify-content: center;

            gap: 28px;
        }


        /* 각각의 카드 */
        .assignment-card {
            flex: 1;

            max-width: 310px;
            min-height: 330px;

            position: relative;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            padding: 35px 30px;

            border-radius: 24px;

            background: rgba(255, 255, 255, 0.75);

            border: 1px solid rgba(255, 255, 255, 0.9);

            box-shadow:
                0 15px 35px rgba(80, 100, 130, 0.12);

            backdrop-filter: blur(12px);

            overflow: hidden;

            transition:
                transform 0.35s ease,
                box-shadow 0.35s ease;
        }


        /* 카드에 마우스를 올렸을 때 */
        .assignment-card:hover {
            transform: translateY(-12px);

            box-shadow:
                0 25px 50px rgba(80, 100, 130, 0.22);
        }


        /* 카드 위쪽 빛 효과 */
        .assignment-card::before {
            content: "";

            position: absolute;

            width: 140px;
            height: 140px;

            border-radius: 50%;

            top: -60px;
            right: -50px;

            opacity: 0.25;

            transition: 0.4s;
        }

        .assignment-card:hover::before {
            transform: scale(1.4);

            opacity: 0.4;
        }


        /* 카드마다 다른 색 */
        .card1::before {
            background-color: #79c9ff;
        }

        .card2::before {
            background-color: #ff9fbd;
        }

        .card3::before {
            background-color: #a990ff;
        }


        /* 숫자 */
        .number {
            width: 55px;
            height: 55px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 16px;

            font-size: 22px;
            font-weight: bold;

            margin-bottom: 35px;
        }

        .card1 .number {
            background-color: #e1f4ff;
            color: #3798d5;
        }

        .card2 .number {
            background-color: #ffe6ef;
            color: #e96491;
        }

        .card3 .number {
            background-color: #eee9ff;
            color: #8067d9;
        }


        /* 카드 글 */
        .assignment-card h2 {
            font-size: 25px;

            margin-bottom: 12px;

            color: #333747;
        }

        .assignment-card p {
            font-size: 14px;

            color: #999;

            line-height: 1.7;
        }


        /* 바로가기 버튼 */
        .go-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;

            width: 100%;

            margin-top: 35px;
            padding: 14px 18px;

            border-radius: 12px;

            background-color: #f5f7fa;

            color: #555;

            text-decoration: none;

            font-size: 14px;
            font-weight: bold;

            transition: 0.3s;
        }


        .go-btn span {
            transition: transform 0.3s;
        }


        .card1 .go-btn:hover {
            background-color: #e2f4ff;

            color: #378fc7;
        }

        .card2 .go-btn:hover {
            background-color: #ffe5ee;

            color: #dc658e;
        }

        .card3 .go-btn:hover {
            background-color: #eee9ff;

            color: #7760cf;
        }


        /* 화살표가 오른쪽으로 움직임 */
        .go-btn:hover span {
            transform: translateX(5px);
        }


        /* 아래 문구 */
        footer {
            text-align: center;

            margin-top: 45px;

            font-size: 13px;

            color: #aaa;
        }


        /* 배경 원 움직임 */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(20px);
            }
        }


        /* 태블릿 / 모바일 */
        @media (max-width: 800px) {

            body {
                overflow: auto;

                padding: 60px 0;
            }

            .title-area h1 {
                font-size: 34px;
            }

            .assignment-list {
                flex-direction: column;

                align-items: center;
            }

            .assignment-card {
                width: 100%;
                max-width: 450px;
                min-height: 260px;
            }
        }

    </style>
</head>


<body>

    <!-- 배경 장식 -->
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>


    <main class="container">

        <!-- 제목 -->
        <section class="title-area">

            <p>WEB PROGRAMMING</p>

            <h1>과제 바로가기</h1>

            <p class="description">
                확인할 과제를 선택해주세요.
            </p>

        </section>


        <!-- 과제 카드 -->
        <section class="assignment-list">

            <!-- 과제 1 -->
            <article class="assignment-card card1">

                <div>

                    <div class="number">
                        01
                    </div>

                    <h2>과제 1</h2>

                    <p>
                        첫 번째 과제 페이지입니다.<br>
                        버튼을 눌러 과제를 확인해보세요.
                    </p>

                </div>


                <!-- href 안에 과제1 경로 입력 -->
                <a href="./subject1/index.html" class="go-btn">
                    과제 보러가기
                    <span>→</span>
                </a>

            </article>



            <!-- 과제 2 -->
            <article class="assignment-card card2">

                <div>

                    <div class="number">
                        02
                    </div>

                    <h2>과제 2</h2>

                    <p>
                        두 번째 과제 페이지입니다.<br>
                        버튼을 눌러 과제를 확인해보세요.
                    </p>

                </div>


                <!-- href 안에 과제2 경로 입력 -->
                <a href="./subject2/index.html" class="go-btn">
                    과제 보러가기
                    <span>→</span>
                </a>

            </article>



            <!-- 과제 3 -->
            <article class="assignment-card card3">

                <div>

                    <div class="number">
                        03
                    </div>

                    <h2>과제 3</h2>

                    <p>
                        세 번째 과제 페이지입니다.<br>
                        버튼을 눌러 과제를 확인해보세요.
                    </p>

                </div>


                <!-- href 안에 과제3 경로 입력 -->
                <a href="./subject3/index.html" class="go-btn">
                    과제 보러가기
                    <span>→</span>
                </a>

            </article>

        </section>


        <footer>
            HTML · CSS Assignment
        </footer>

    </main>

</body>

</html>
