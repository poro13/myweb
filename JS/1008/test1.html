<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 배열
        const fruits = ['사과', '오렌지', '배', '딸기'];
        console.log(fruits);
        console.log(fruits[0]);
        console.log(fruits.length);
        console.log(fruits.at(1));
        console.log(fruits.at(-1));
        fruits[4] = '복숭아';
        console.log(fruits);
        fruits.push('바나나');
        console.log(fruits);
        fruits.unshift('포도');
        console.log(fruits);

        const target = ['가','나','다','라','마'];
        target[3] = '카';
        console.log(target);
        target[target.length-1] = '타';
        console.log(target);
        target.pop();
        console.log(target);
        target.shift();
        console.log(target);
        console.log(target[0]);
        target.splice(1,1);
        console.log(target);
        target.splice(1);
        console.log(target);
        target.push('마');
        console.log(target);
        
        const result = target.includes('마');
        console.log(result);
        const result2 = target.includes('가');
        console.log(result2);

        console.log('hello'.length);
        console.log(['1','2','3'].join(' '));
        console.log('2345'.split(''));
        console.log('2,3,4,5'.split(','));
        console.log('2,3,4,5'.split(''));

        const target2 = ['가','나','다'];
        for(let i = 0; i < target2.length; i++){
            console.log(target2[i]);
        }

        // 문제. indexOf(), splice()를 사용해 '라' 모두 삭제
        const arr = ['가','나','다','라','마','라'];
        while(true){
            if(arr.indexOf('라') > -1){
                arr.splice(arr.indexOf('라'),1);
            }else{
                break;
            }
        }
        console.log(arr);

        const twoDimension = [
            ['a',null],
            [1, undefined],
            [NaN, true],
            ['',0]
        ];
        console.log(twoDimension);

        // for문으로 5 x 4 이차원 배열 만들기. 배열의 요소는 전부 1
        const forTwoDimen = [];
        for(let i = 0; i < 5; i++){
            const inner = [];
            for(let j = 0; j < 4; j++){
                inner.push(1);
            }
            forTwoDimen.push(inner);
        }
        console.log(forTwoDimen);

        const oneDi = forTwoDimen.flat();
        console.log(oneDi);

        const empty = Array(5);
        console.log(empty);
        empty.fill(1);
        console.log(empty);
    </script>
</body>
</html>
