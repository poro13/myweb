            },

            },
            {
                id: 14,
                question: '어떤 결정을 내려야 하는데 한쪽이 더 효율적이고 다른 쪽이 사람들에게 더 좋다면?',
                A: '장기적으로 더 합리적이고 효율적인 선택을 한다.',

            },
            {
                id: 16,
                question: '여행을 간다면 나는?',
                A: '출발 전에 일정과 주요 계획을 어느 정도 정해두는 편이다.',

                resultB: 'P',
            },
            {
                id: 17,
                question: '해야 할 일이 여러 개 있다면?',
                A: '우선순위를 정하고 하나씩 끝내면서 진행한다.',

                resultB: 'P',
            },
            {
                id: 18,
                question: '약속 시간까지 아직 시간이 많이 남았다면?',
                A: '미리 준비를 끝내고 여유롭게 기다리는 편이다.',
                B: '시간이 가까워졌을 때 준비해도 괜찮다고 생각한다.',
                resultA: 'J',
                resultB: 'P',
            },
            {
                id: 19,
                question: '갑자기 계획에 없던 일이 생겼을 때 나는?',
                A: '기존 계획이 흐트러지는 것이 신경 쓰인다.',
                B: '오히려 새로운 상황이 생긴 것을 재미있게 받아들인다.',
                resultA: 'J',
                resultB: 'P',
            },
            {
                id: 20,
                question: '과제를 해야 하는데 마감까지 일주일 남았다면?',
                A: '미리 시작해서 가능한 한 빨리 끝내려고 한다.',
                B: '마감이 가까워질수록 집중력이 올라가므로 어느 정도 미뤄두기도 한다.',
                resultA: 'J',
                resultB: 'P',
            },
        ];

        const selectAns = (question) => {

            const userSelect = prompt(question.id + '. ' + question.question + '\n'
                + 'A: ' + question.A + '\n' + 'B: ' + question.B);
            if (userSelect.toUpperCase() === 'A') { // 소문자 a도 같이 취급.
                mbtiTypes[question.resultA]++;
            } else if (userSelect.toUpperCase() === 'B') {
                mbtiTypes[question.resultB]++;
            } else {
                console.log('잘못 입력함.');
            }
        }

        const getMbti = (mbtiTypes) => {
            return (mbtiTypes.E > mbtiTypes.I ? 'E' : 'I') +
                (mbtiTypes.S > mbtiTypes.N ? 'S' : 'N') +
                (mbtiTypes.T > mbtiTypes.F ? 'T' : 'F') +
                (mbtiTypes.J > mbtiTypes.P ? 'J' : 'P')
        };


        for (const question of questions) {
            selectAns(question);
        }

        const myMbti = getMbti(mbtiTypes);
        console.log('나의 mbti는 ' + myMbti + '입니다.');

    </script>
