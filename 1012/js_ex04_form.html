<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>form의 name 속성 이용하여 입력요소 식별하기</h1>
    <hr>
    <form name="frm">
        <input type="text" name="first_name" placeholder="Input first name..."><br>
        <input type="text" name="last_name" placeholder="Input last name..."><br>
        <button type="button" id="reg-btn">이름 합치기</button> <!-- form 안에서는 button의 타입을 지정 안해주면 submit을 작동 -->
    </form>
    <div id="demo">여기에 이름이 합쳐 집니다.</div>
    <script>
        const reg_btn = document.getElementById("reg-btn");

        reg_btn.addEventListener("click", () => {
            const first_name = document.frm.first_name.value;
            const last_name = document.frm.last_name.value;
            demo.textContent = `이름은 ${first_name} 이고, 성은 ${last_name}입니다.`; 
        });
    </script>
</body>
</html>
