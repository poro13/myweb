<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        #text-space {
            width: 600px;
            height: 50px;
            font-size: 18px;
            text-align: right;
        }

        .container-grid {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(4, 120px);
            grid-template-rows: repeat(4, 80px);
            gap: 10px;
        }

        .container-grid button {
            font-size: 18px;
            height: 80px;
        }
    </style>
</head>

<body>
    <div id="main">
        <div id="text">
            <input type="text" id="text-space">
        </div>
        <div class="container-grid" id="buttons">
            <button id="1">1</button>
            <button id="2">2</button>
            <button id="3">3</button>
            <button id="plus">+</button>
            <button id="4">4</button>
            <button id="5">5</button>
            <button id="6">6</button>
            <button id="minus">-</button>
            <button id="7">7</button>
            <button id="8">8</button>
            <button id="9">9</button>
            <button id="multiply">*</button>
            <button id="0">0</button>
            <button id="divide">/</button>
            <button id="equal">=</button>
            <button id="clear">c</button>
        </div>
    </div>

    <script>
        const textSpace = document.getElementById("text-space");
        const buttons = document.getElementById("buttons");

        buttons.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') return;

            else if (e.target.id === "clear") {
                textSpace.value = "";
            } else if (e.target.id === "equal") {
                textSpace.value = eval(textSpace.value);
            } else {
                const value = e.target.textContent;
                const lastChar = textSpace.value.slice(-1);
                const operator = ['+', '-', '*', '/'];
                if (operator.includes(value) && operator.includes(lastChar)) {
                    return;
                } else {
                    textSpace.value += value;
                }
            }
        });
    </script>
</body>

</html>
