<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: red;
        }
    </style>
</head>
<body>
    <h1>HTML로 텍스트 만들기</h1>
    <hr>
    <div id="demo"></div>
   
    <hr>
    <button id="btn">HTML 추가하기</button>

    <script>
        const btn = document.getElementById("btn");
        btn.addEventListener("click", () => {
            const demo = document.getElementById("demo");
            //demo.textContent =  "<p>hello</p>";
            demo.innerHTML = "<p>hello</p>";
        });
    </script>
</body>
</html>
