<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form name="frm">
        <input type="radio" name="job" value="developer"> 개발자
        <input type="radio" name="job" value="designer"> 디자이너
        <input type="radio" name="job" value="teacher"> 강사
        <button type="button" id="btn">확인</button>
    </form>
    <hr>
    <div id="demo">here</div>
    <script>
        const btn = document.getElementById("btn");
        const demo = document.getElementById("demo");
        btn.addEventListener("click", () => {
            const radios = document.frm.job;

            for(let i = 0; i < radios.length; i++){
                if(radios[i].checked){
                    demo.textContent = `value : ${radios[i].value},
                    텍스트: ${radios[i].nextSibling.textContent}`;
                }
            }
        });
    </script>
</body>

</html>
