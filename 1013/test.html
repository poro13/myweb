<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 1. 학생 데이터
        const students = [
            { id: 1, name: '김철수', age: 17, grade: 'A', score: 92, subjects: ['수학', '영어'] },
            { id: 2, name: '이영희', age: 16, grade: 'B', score: 78, subjects: ['과학', '영어'] },
            { id: 3, name: '박민수', age: 18, grade: 'A', score: 88, subjects: ['수학', '과학'] },
            { id: 4, name: '최지연', age: 17, grade: 'C', score: 65, subjects: ['영어', '미술'] },
            { id: 5, name: '정다운', age: 16, grade: 'B', score: 81, subjects: ['수학', '체육'] },
            { id: 6, name: '한소희', age: 18, grade: 'A', score: 95, subjects: ['과학', '수학'] },
            { id: 7, name: '오세훈', age: 17, grade: 'D', score: 52, subjects: ['미술', '체육'] },
            { id: 8, name: '윤아름', age: 16, grade: 'B', score: 76, subjects: ['영어', '과학'] },
        ];

        // 2. 상품 데이터
        const products = [
            { id: 101, name: '노트북', category: '전자기기', price: 1500000, stock: 5, rating: 4.5 },
            { id: 102, name: '마우스', category: '전자기기', price: 35000, stock: 50, rating: 4.2 },
            { id: 103, name: '책상', category: '가구', price: 250000, stock: 12, rating: 4.8 },
            { id: 104, name: '의자', category: '가구', price: 180000, stock: 8, rating: 4.0 },
            { id: 105, name: '키보드', category: '전자기기', price: 120000, stock: 0, rating: 4.6 },
            { id: 106, name: '스탠드', category: '가구', price: 45000, stock: 30, rating: 3.9 },
            { id: 107, name: '모니터', category: '전자기기', price: 400000, stock: 15, rating: 4.7 },
            { id: 108, name: '책장', category: '가구', price: 320000, stock: 3, rating: 4.3 },
        ];

        // 3. 주문 데이터
        const orders = [
            { orderId: 1, userId: 'user1', items: [{ name: '노트북', qty: 1, price: 1500000 }], status: '배송완료' },
            { orderId: 2, userId: 'user2', items: [{ name: '마우스', qty: 2, price: 35000 }, { name: '키보드', qty: 1, price: 120000 }], status: '배송중' },
            { orderId: 3, userId: 'user1', items: [{ name: '의자', qty: 1, price: 180000 }], status: '배송완료' },
            { orderId: 4, userId: 'user3', items: [{ name: '책상', qty: 1, price: 250000 }, { name: '스탠드', qty: 2, price: 45000 }], status: '주문접수' },
            { orderId: 5, userId: 'user2', items: [{ name: '모니터', qty: 1, price: 400000 }], status: '배송완료' },
        ];

        // 4. 숫자 배열
        const numbers = [3, 7, 1, 9, 4, 12, 8, 5, 15, 2, 6, 11];


        // filter를 이용해서.. 
        // 학생들을 대상으로 성적이 80점이상인 학생들만 추출하기
        const filter1 = students.filter((stu) => stu.score >= 80);
        console.log(filter1);

        // 수학을 수강한 학생만 추출하기
        const filter2 = students.filter((stu) => stu.subjects.includes('수학'));
        console.log(filter2);

        // 재고가 있는 상품만 추출하기
        const filter3 = products.filter((pro) => pro.stock > 0);
        console.log(filter3);

        // 전자기기 카테고리 이면서 가격이 20만원 이하인 상품 추출
        const filter4 = products.filter((pro) => pro.category === '전자기기' && pro.price <= 200000);
        console.log(filter4);

        // 숫자배열에서 짝수만 추출하기
        const filter5 = numbers.filter((num) => num % 2 === 0);
        console.log(filter5);

        // map을 이용해서..
        // 학생 이름만
        const map1 = students.map((stu) => stu.name);
        console.log(map1);

        // 숫자 배열의 각 요소를 제곱한 배열
        const map2 = numbers.map((num) => num * num);
        console.log(map2);

        // 모든 상품 가격에 부가세(10%) 포함 가격 배열 만들기
        const map3 = products.map((pro) => pro.price * 1.1);
        console.log(map3);

        // 주문별 총 금액 계산해서 배열 만들기
        const map4 = orders.map((order) => {
            let sum = 0;
            for (const item of order.items) {
                sum += item.price * item.qty;
            }
            return sum;
        });
        console.log(map4);

        // reduce
        // 숫자 배열 합계
        const reduce1 = numbers.reduce((acc, cur) => {
            return acc + cur;
        }, 0);
        console.log(reduce1);
        // 상품의 총 재고 가치 (price * stock 합)
        const reduce2 = products.reduce((acc, cur) => {
            return acc + cur.price * cur.stock;
        }, 0);
        console.log(reduce2);

        // 카테고리별 상품 개수 세기
        const reduce3 = products.reduce((acc,cur) => {
            const category = cur.category;
            if(!acc[category]){
                acc[category] = 0; // ex. acc['전자기구'] = 0;
            }

            acc[category] += 1;

            return acc;
        }, {});
        console.log(reduce3);

        // 학생들의 평균 점수
        const reduce4 = students.reduce((acc,cur)=>{
            return acc + cur.score;
        },0) / students.length;
        console.log(reduce4);

        // 최고 점수 학생 찾기
        const reduce5 = students.reduce((acc, cur) => {
            return (acc.score > cur.score ? acc : cur);
        });
        console.log(reduce5);
    </script>
</body>

</html>
