<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 상세 정보</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 45px auto; padding: 0 20px; }
        img { width: 220px; height: 220px; object-fit: contain; border: 1px solid #ddd; }
        .link-btn { display: inline-block; padding: 10px 18px; background: #333; color: white; border-radius: 4px; text-decoration: none; }
    </style>
</head>
<body>
    <h1>상품 상세 정보</h1>
    <hr>
    <div id="productDetail">
        <p id="pro_name">상품의 이름은 ... 입니다.</p>
        <p id="pro_img">상품의 이미지<br><img id="img" alt="상품 이미지"></p>
        <p id="pro_price">상품의 가격은 ... 원 입니다.</p>
    </div>
    <a class="link-btn" href="list_pro.html">목록으로</a>

    <script>
        const params = new URLSearchParams(location.search);
        const id = params.get("id");
        const products = JSON.parse(localStorage.getItem("products") || "[]");
        const product = products.find(function (item) { return item.id === id; });

        if (product) {
            document.getElementById("pro_name").textContent = `상품의 이름은 ${product.name} 입니다.`;
            document.getElementById("img").src = product.image;
            document.getElementById("img").alt = product.name;
            document.getElementById("pro_price").textContent = `상품의 가격은 ${Number(product.price).toLocaleString("ko-KR")}원 입니다.`;
        } else {
            document.getElementById("productDetail").textContent = "선택한 상품을 찾을 수 없습니다. 목록에서 상품을 다시 선택해주세요.";
        }
    </script>
</body>
</html>
