<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 목록</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 850px; margin: 45px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; text-align: center; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 12px; }
        th { background: #f1f1f1; }
        td img { display: block; width: 110px; height: 110px; object-fit: cover; margin: 0 auto; border-radius: 4px; }
        td a { display: inline-block; }
        .link-btn { display: inline-block; padding: 10px 18px; background: #333; color: white; border-radius: 4px; text-decoration: none; }
    </style>
</head>
<body>
    <h1>상품 목록</h1>
    <a class="link-btn" href="product.html">상품 등록하기</a>

    <table>
        <thead>
            <tr>
                <th>이미지</th>
                <th>상품 이름</th>
                <th>가격</th>
            </tr>
        </thead>
        <tbody id="productList"></tbody>
    </table>

    <script>
        const products = JSON.parse(localStorage.getItem("products") || "[]");
        const productList = document.getElementById("productList");

        if (products.length === 0) {
            const tr = document.createElement("tr");
            const td = document.createElement("td");
            td.colSpan = 3;
            td.textContent = "등록된 상품이 없습니다.";
            tr.appendChild(td);
            productList.appendChild(tr);
        }

        products.forEach(function (product) {
            const tr = document.createElement("tr");

            const imageTd = document.createElement("td");
            const link = document.createElement("a");
            link.href = "result_pro.html?id=" + encodeURIComponent(product.id);
            const img = document.createElement("img");
            img.src = product.image;
            img.alt = product.name;
            link.appendChild(img);
            imageTd.appendChild(link);

            const nameTd = document.createElement("td");
            nameTd.textContent = product.name;

            const priceTd = document.createElement("td");
            priceTd.textContent = Number(product.price).toLocaleString("ko-KR") + "원";

            tr.append(imageTd, nameTd, priceTd);
            productList.appendChild(tr);
        });
    </script>
</body>
</html>
