<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img {
            width: 100px;
            height: 100px;
        }
    </style>
</head>

<body>
    <h1>물건 등록 결과입니다.</h1>
    <hr>
    <div>
        <p id="pro_name">상품의 이름은 ... 입니다.</p>
        <p id="pro_img">상품의 이미지<br><img id="img" src="" alt="이미지"></p>
        <p id="pro_price">상품의 가격은 ... 원 입니다.</p>
        <a class="link-btn" href="list_pro.html">목록으로</a>
    </div>
    <script>
        const params = new URLSearchParams(location.search);
        console.log(params.get('pro_name'));
        console.log(params.get('pro_img'));
        console.log(params.get('pro_price'));

        const id = params.get("id");
        const products = JSON.parse(localStorage.getItem("products") || "[]");
        const product = products.find(function (item) { return item.id === id; });

        if(product){
            document.getElementById("pro_name").textContent = `상품의 이름은 ${product.name}입니다.`;
            document.getElementById("img").src = product.image;
            document.getElementById("img").alt = product.name;
            document.getElementById("pro_price").textContent = `상품의 가격은 ${Number(product.price)}원 입니다.`;
        }else{
            alert("선택한 상품을 찾을 수 없습니다. 목록에서 상품을 다시 선택해주세요.");
        }
    </script>
</body>

</html>
