<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문화재 위치</title>
    <style>
        body { margin: 30px; }
        #map { width: 100%; height: 450px; }
        #message { color: #b03a2e; }
    </style>
</head>
<body>
    <h1 id="name">문화재 위치</h1>
    <p id="address"></p>
    <p id="message"></p>
    <div id="map"></div>
    <p><a href="ajax.html">목록으로 돌아가기</a></p>

    <!-- 아래 YOUR_KAKAO_JAVASCRIPT_KEY 부분을 본인의 카카오 JavaScript 키로 변경 -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_JAVASCRIPT_KEY"></script>
    <script>
        // ajax.html에서 전달한 위도/경도를 가져옴
        const params = new URLSearchParams(location.search);
        const latText = params.get("lat");
        const lngText = params.get("lng");
        const lat = Number(latText);
        const lng = Number(lngText);

        document.getElementById("name").textContent = params.get("name") || "문화재 위치";
        document.getElementById("address").textContent = params.get("address") || "";

        // 좌표가 아직 입력되지 않은 문화재는 잘못된 위치에 마커를 찍지 않음
        if (!latText || !lngText || !Number.isFinite(lat) || !Number.isFinite(lng)
            || lat < -90 || lat > 90 || lng < -180 || lng > 180) {
            document.getElementById("message").textContent =
                "위도/경도가 등록되지 않았습니다. ajax.html의 locationMap에 실제 좌표를 입력해주세요.";
        } else if (typeof kakao === "undefined" || !kakao.maps) {
            document.getElementById("message").textContent =
                "카카오 지도를 불러올 수 없습니다. JavaScript 키와 등록 도메인을 확인해주세요.";
        } else {
            var mapContainer = document.getElementById("map"),
                mapOption = {
                    center: new kakao.maps.LatLng(lat, lng),
                    level: 3
                };

            var map = new kakao.maps.Map(mapContainer, mapOption);

            var markerPosition = new kakao.maps.LatLng(lat, lng);
            var marker = new kakao.maps.Marker({
                position: markerPosition
            });

            marker.setMap(map);
        }
    </script>
</body>
</html>
