<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PC, 콘솔, 모바일 게임을 한눈에 살펴보는 게임 추천 사이트">
    <title>GAME PICK | 게임 추천 사이트</title>

    <style>
        /* ===== 1. 기본 설정 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #080d1a;
            --surface: #131c30;
            --text: #f7f8ff;
            --muted: #a1adc5;
            --accent: #9bf6ce;
            --border: rgba(255, 255, 255, 0.09);
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 85% 5%, rgba(87, 81, 194, 0.22), transparent 35%),
                radial-gradient(circle at 7% 36%, rgba(10, 132, 137, 0.13), transparent 32%),
                var(--bg);
            color: var(--text);
            font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            line-height: 1.6;
        }

        button, a { -webkit-tap-highlight-color: transparent; }
        button { font: inherit; }
        a { color: inherit; text-decoration: none; }

        .container {
            width: min(1140px, calc(100% - 40px));
            margin: 0 auto;
        }

        /* ===== 2. 헤더 ===== */
        header {
            border-bottom: 1px solid var(--border);
            background: rgba(8, 13, 26, 0.75);
        }

        .header-inner {
            min-height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 11px;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: var(--accent);
            font-size: 23px;
        }

        .brand strong { color: var(--accent); }
        .header-note { color: var(--muted); font-size: 13px; }

        /* ===== 3. 소개 영역 ===== */
        .hero {
            padding: 68px 0 37px;
            text-align: center;
        }

        .eyebrow {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            border: 1px solid rgba(155, 246, 206, 0.25);
            border-radius: 999px;
            padding: 7px 13px;
            color: var(--accent);
            background: rgba(155, 246, 206, 0.07);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.4px;
        }

        .hero h1 {
            margin-top: 18px;
            font-size: clamp(30px, 5vw, 49px);
            line-height: 1.3;
            letter-spacing: -2px;
        }

        .hero h1 span { color: var(--accent); }
        .hero p { margin-top: 15px; color: var(--muted); font-size: 15px; }

        /* ===== 4. 카테고리 메뉴 ===== */
        .category-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 12px auto 55px;
        }

        .nav-btn {
            min-width: 145px;
            padding: 13px 22px;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--muted);
            background: #12192a;
            cursor: pointer;
            transition: background .2s, color .2s, border-color .2s, transform .2s;
        }

        .nav-btn:hover {
            color: white;
            border-color: rgba(155, 246, 206, .45);
            transform: translateY(-2px);
        }

        .nav-btn.active {
            border-color: var(--accent);
            background: var(--accent);
            color: #102320;
            font-weight: 800;
        }

        .nav-btn:focus-visible,
        .action:focus-visible,
        .retry-btn:focus-visible {
            outline: 3px solid #f2c366;
            outline-offset: 3px;
        }

        /* ===== 5. 목록 제목 ===== */
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 12px;
            margin-bottom: 22px;
        }

        .section-title .small-title {
            color: var(--accent);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .section-title h2 {
            margin-top: 4px;
            font-size: clamp(23px, 4vw, 31px);
            letter-spacing: -1px;
        }

        .section-count { color: var(--muted); font-size: 13px; }

        /* ===== 6. 게임 카드 (Grid) ===== */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
            min-height: 310px;
        }

        .game-card {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--surface);
            box-shadow: 0 14px 40px rgba(0, 0, 0, .14);
            transition: transform .25s, border-color .25s, box-shadow .25s;
        }

        .game-card:hover {
            transform: translateY(-7px);
            border-color: rgba(155, 246, 206, .42);
            box-shadow: 0 20px 48px rgba(0, 0, 0, .24);
        }

        .card-cover {
            height: 218px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #40417f, #144e72);
        }

        .card-cover img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: transform .4s;
        }

        .game-card:hover .card-cover img { transform: scale(1.05); }
        .card-cover img.failed { display: none; }

        .image-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            font-size: 25px;
            font-weight: 900;
            word-break: keep-all;
            z-index: 0;
        }

        .card-cover img { position: relative; z-index: 1; }

        .rank {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 2;
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255,255,255,.22);
            border-radius: 12px;
            background: rgba(7, 11, 20, .78);
            font-size: 15px;
            font-weight: 900;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            padding: 24px;
            min-height: 230px;
        }

        .genre {
            align-self: flex-start;
            margin-bottom: 10px;
            padding: 4px 9px;
            border: 1px solid rgba(155, 246, 206, .17);
            border-radius: 6px;
            color: var(--accent);
            background: rgba(155, 246, 206, .07);
            font-size: 11px;
            font-weight: 700;
        }

        .game-name {
            font-size: 21px;
            line-height: 1.4;
            letter-spacing: -.7px;
            word-break: keep-all;
        }

        .game-description {
            margin-top: 10px;
            margin-bottom: 23px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.8;
            word-break: keep-all;
            flex: 1;
        }

        .card-actions { display: flex; gap: 9px; }

        .action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex: 1;
            min-width: 0;
            min-height: 43px;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 9px;
            padding: 9px 5px;
            font-size: 12px;
            font-weight: 800;
            transition: background .2s, color .2s;
        }

        .action.buy {
            background: var(--accent);
            color: #102320;
            border-color: var(--accent);
        }

        .action.buy:hover { background: #c7ffe5; }
        .action.website:hover { background: rgba(255,255,255,.1); }

        /* ===== 7. 오류 안내와 하단 ===== */
        .message {
            grid-column: 1 / -1;
            padding: 80px 20px;
            border: 1px dashed rgba(255,255,255,.2);
            border-radius: 16px;
            text-align: center;
            color: var(--muted);
            background: rgba(255,255,255,.025);
        }

        .message strong { color: var(--text); }
        .message p { margin-top: 10px; font-size: 13px; }

        .retry-btn {
            margin-top: 18px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #102320;
            cursor: pointer;
            font-weight: 800;
        }

        footer {
            margin-top: 86px;
            border-top: 1px solid var(--border);
            padding: 30px 0 40px;
            text-align: center;
            color: #8491ab;
            font-size: 12px;
            line-height: 2;
        }

        /* ===== 8. 반응형 ===== */
        @media (max-width: 950px) {
            .game-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 630px) {
            .container { width: min(100% - 28px, 1140px); }
            .header-inner { min-height: 67px; }
            .brand { font-size: 19px; }
            .brand-icon { width: 35px; height: 35px; }
            .header-note { display: none; }
            .hero { padding: 55px 0 30px; }
            .hero h1 { letter-spacing: -1px; }
            .hero p { font-size: 13px; word-break: keep-all; }
            .category-nav { gap: 7px; margin-bottom: 43px; }
            .nav-btn { min-width: 0; flex: 1; padding: 12px 7px; font-size: 13px; }
            .section-count { font-size: 12px; }
            .game-grid { grid-template-columns: 1fr; gap: 17px; }
            .card-cover { height: 225px; }
            .card-content { min-height: 0; }
            footer { margin-top: 65px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; }
        }
    </style>
</head>

<body>
    <header>
        <div class="container header-inner">
            <a href="./index.html" class="brand" aria-label="GAME PICK 첫 화면">
                <span class="brand-icon" aria-hidden="true">🎮</span>
                <span>GAME <strong>PICK</strong></span>
            </a>
            <p class="header-note">당신의 다음 게임을 찾아보세요</p>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <div class="eyebrow">✦ GAME RECOMMENDATION</div>
            <h1>오늘은 <span>어떤 게임</span>을 할까?</h1>
            <p>PC부터 콘솔, 모바일까지! 플랫폼별 추천 게임 TOP 3를 만나보세요.</p>
        </section>

        <!-- nav 버튼을 누르면 페이지 이동 없이 아래의 3개 카드만 변경됩니다. -->
        <nav class="category-nav" aria-label="게임 플랫폼 선택">
            <button type="button" class="nav-btn active" data-category="pc" aria-pressed="true">💻 PC 게임</button>
            <button type="button" class="nav-btn" data-category="console" aria-pressed="false">🎮 콘솔 게임</button>
            <button type="button" class="nav-btn" data-category="mobile" aria-pressed="false">📱 모바일 게임</button>
        </nav>

        <section aria-labelledby="category-title">
            <div class="section-title">
                <div>
                    <p class="small-title" id="category-english">PC GAMES</p>
                    <h2 id="category-title">PC 게임 추천 TOP 3</h2>
                </div>
                <span class="section-count" id="section-count">총 3개의 게임</span>
            </div>

            <!-- JSON에서 읽은 게임 카드를 JavaScript가 여기에 생성합니다. -->
            <div id="game-grid" class="game-grid" aria-live="polite">
                <div class="message">게임 정보를 불러오는 중입니다...</div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>GAME PICK © 2026 · HTML / CSS / JavaScript / JSON(AJAX)</p>
            <p>학습용 추천 목록으로, 실시간 판매량·인기 순위를 의미하지 않습니다.</p>
            <p>게임 이미지 및 상표의 권리는 각 권리자에게 있습니다.</p>
        </div>
    </footer>

    <script>
        // ===== 1. HTML 요소 선택 =====
        const navButtons = document.querySelectorAll(".nav-btn");
        const gameGrid = document.getElementById("game-grid");
        const categoryTitle = document.getElementById("category-title");
        const categoryEnglish = document.getElementById("category-english");
        const sectionCount = document.getElementById("section-count");

        // AJAX로 가져온 JSON 데이터를 저장해 두는 변수
        let gameData = null;
        let selectedCategory = "pc";

        const categoryInfo = {
            pc: { title: "PC 게임 추천 TOP 3", english: "PC GAMES" },
            console: { title: "콘솔 게임 추천 TOP 3", english: "CONSOLE GAMES" },
            mobile: { title: "모바일 게임 추천 TOP 3", english: "MOBILE GAMES" }
        };

        // ===== 2. AJAX로 games.json 불러오기 =====
        function loadGames() {
            gameGrid.innerHTML = '<div class="message">게임 정보를 불러오는 중입니다...</div>';

            const xhttp = new XMLHttpRequest();
            xhttp.open("GET", "./games.json", true);

            xhttp.onload = function () {
                if (xhttp.status >= 200 && xhttp.status < 300) {
                    try {
                        gameData = JSON.parse(xhttp.responseText);
                        renderGames(selectedCategory);
                    } catch (error) {
                        showError();
                        console.error("JSON 파일 형식 오류:", error);
                    }
                } else {
                    showError();
                    console.error("JSON 요청 실패:", xhttp.status);
                }
            };

            xhttp.onerror = function () {
                showError();
                console.error("네트워크 오류: games.json을 불러오지 못했습니다.");
            };

            xhttp.send();
        }

        // ===== 3. 선택된 카테고리의 카드 출력 =====
        function renderGames(category) {
            if (!gameData) return;

            const games = gameData[category];
            const info = categoryInfo[category];

            categoryTitle.textContent = info.title;
            categoryEnglish.textContent = info.english;
            gameGrid.innerHTML = "";

            if (!Array.isArray(games) || games.length === 0) {
                sectionCount.textContent = "총 0개의 게임";
                gameGrid.innerHTML = '<div class="message">등록된 게임이 없습니다.</div>';
                return;
            }

            const topGames = games.slice(0, 3);
            sectionCount.textContent = `총 ${topGames.length}개의 게임`;

            topGames.forEach(function (game, index) {
                const card = document.createElement("article");
                card.className = "game-card";

                // 카드 틀 작성 (실제 이름/이미지/링크는 아래에서 JSON 값으로 삽입)
                card.innerHTML = `
                    <div class="card-cover">
                        <div class="image-fallback"></div>
                        <img class="game-image" loading="lazy">
                        <span class="rank"></span>
                    </div>
                    <div class="card-content">
                        <span class="genre"></span>
                        <h3 class="game-name"></h3>
                        <p class="game-description"></p>
                        <div class="card-actions">
                            <a class="action buy" target="_blank" rel="noopener noreferrer"></a>
                            <a class="action website" target="_blank" rel="noopener noreferrer">공식 홈페이지 ↗</a>
                        </div>
                    </div>
                `;

                card.querySelector(".rank").textContent = `0${index + 1}`;
                card.querySelector(".genre").textContent = game.genre;
                card.querySelector(".game-name").textContent = game.name;
                card.querySelector(".game-description").textContent = game.description;
                card.querySelector(".image-fallback").textContent = game.name;

                // 게임 이미지 로딩 실패 시 뒤에 있는 그라데이션과 이름이 보입니다.
                const image = card.querySelector(".game-image");
                image.alt = game.name + " 게임 이미지";
                image.addEventListener("error", function () {
                    image.classList.add("failed");
                });
                image.src = game.image;

                // PC·콘솔: 다나와 / 모바일: Google Play
                const buyLink = card.querySelector(".buy");
                buyLink.href = game.buyUrl;
                buyLink.textContent = category === "mobile" ? "설치하러 가기 ↗" : "구매하러 가기 ↗";

                // 게임 공식 홈페이지
                card.querySelector(".website").href = game.homepageUrl;

                gameGrid.appendChild(card);
            });
        }

        // ===== 4. 파일 불러오기 실패 시 메시지 =====
        function showError() {
            gameGrid.innerHTML = `
                <div class="message">
                    <strong>games.json을 불러올 수 없습니다.</strong>
                    <p>index.html과 games.json이 같은 폴더에 있는지 확인하고,<br>
                    VS Code의 Live Server로 실행해 주세요.</p>
                    <button type="button" class="retry-btn">다시 시도</button>
                </div>
            `;
            gameGrid.querySelector(".retry-btn").addEventListener("click", loadGames);
        }

        // ===== 5. nav 클릭 이벤트 =====
        navButtons.forEach(function (button) {
            button.addEventListener("click", function () {
                selectedCategory = button.dataset.category;

                navButtons.forEach(function (navButton) {
                    const isSelected = (navButton === button);
                    navButton.classList.toggle("active", isSelected);
                    navButton.setAttribute("aria-pressed", String(isSelected));
                });

                renderGames(selectedCategory);
            });
        });

        // ===== 6. 최초 실행 시 JSON 가져오기 =====
        loadGames();
    </script>
</body>
</html>
