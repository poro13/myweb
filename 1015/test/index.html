<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 추천</title>

    <style>
        *{
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container{
            width: min(1140px, calc(100%-40px));
            margin: 0 auto;
        }

        /* 헤더 */
        header{
            border-bottom: 1px solid black;
        }

        .header-inner{
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .hero{
            text-align: center;
        }

        /* 카테고리 메뉴 */
        .category-nav{
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 12px auto 55px;
            background: greenyellow;
        }

        /* 목록 제목 */
        .section-title{
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 12px;
            margin-bottom: 22px;
        }

        /* 게임 카드 (grid) */
        .game-grid{
            display: grid;
            grid-template-columns: repeat(3,minmax(0,1fr));
            gap: 22px;
            min-height: 310px;
        }
        
        .card-cover{
            height: 218px;
            position: relative;
            overflow: hidden;
        }
        .card-cover img{
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .card-content{
            display: flex;
            flex-direction: column;
            padding: 24px;
            min-height: 230px;
        }
    </style>
</head>

<body>

    <header>
        <div class="container header-inner">
            <a href="./index.html" class="brand" aria-label="GAME PICK 첫 화면">
                <span class="brand-icon" aria-hidden="true">🎮</span>
                <span>GAME <strong>PICKER</strong></span>
            </a>
            <p class="header-note">당신의 다음 게임을 찾아보세요</p>
        </div>
    </header>
    <main class="container">
        <section class="hero">
            <div class="eyebrow">GAME RECOMMENDATION</div>
            <h1>오늘은 <span>어떤 게임</span>을 할까?</h1>
            <p>PC부터 콘솔, 모바일까지! 플랫폼별 추천 게임 TOP3를 만나보세요!</p>
        </section>

        <nav class="category-nav" aria-label="게임 플랫폼 선택">
            <button type="button" class="nav-btn active" data-category="pc" aria-pressed="true">PC 게임</button>
            <button type="button" class="nav-btn" data-category="console" aria-pressed="false">콘솔 게임</button>
            <button type="button" class="nav-btn" data-category="mobile" aria-pressed="false">모바일 게임</button>
        </nav>

        <section aria-labelledby="category-title">
            <div class="section-title">
                <div>
                    <p class="small-title" id="category-english">PC GAMES</p>
                    <h2 id="category-title">PC 게임 추천 TOP 3</h2>
                </div>
                <span class="section-count" id="section-count">총 3개의 게임</span>
            </div>

            <div id="game-grid" class="game-grid" aria-live="polite">
                <div class="message">게임 정보를 불러오는 중입니다...</div>
            </div>
        </section>
    </main>
    <script>
        // 1. HTML 요소 선택
        const navButtons = document.querySelectorAll(".nav-btn");
        const gameGrid = document.getElementById("game-grid");
        const categoryTitle = document.getElementById("category-title");
        const categoryEnglish = document.getElementById("category-english");
        const sectionCount = document.getElementById("section-count");

        let gameData = null;
        let selectedCategory = "pc";

        const categoryInfo = {
            pc: { title: "PC 게임 추천 TOP 3", english: "PC GAMES" },
            console: { title: "콘솔 게임 추천 TOP 3", english: "CONSOLE GAMES" },
            mobile: { title: "모바일 게임 추천 TOP 3", english: "MOBILE GAMES" }
        };

        function loadGames() {
            gameGrid.innerHTML = '<div class="message">게임 정보를 불러오는 중입니다...</div>';

            const xhttp = new XMLHttpRequest();
            xhttp.open("GET", "./games.json", true);

            xhttp.onload = function () {
                if (xhttp.status >= 200 && xhttp.status < 300) {
                    try {
                        gameData = JSON.parse(xhttp.responseText);
                        renderGames(selectedCategory);
                    } catch (error) {
                        showError();
                        console.error("JSON 파일 형식 오류: ", error);
                    }
                } else {
                    showError();
                    console.error("JSON 요청 실패:", xhttp.status);
                }
            };

            xhttp.onerror = function () {
                showError();
                console.error("네트워크 오류: games.json을 불러오지 못했습니다.");
            };

            xhttp.send();
        }

        // 선택된 카테고리의 카드 출력
        function renderGames(category) {
            if (!gameData) return;

            const games = gameData[category];
            const info = categoryInfo[category];

            categoryTitle.textContent = info.title;
            categoryEnglish.textContent = info.english;
            gameGrid.innerHTML = "";

            if (!Array.isArray(games) || games.length === 0) {
                sectionCount.textContent = "총 0개의 게임";
                gameGrid.innerHTML = '<div class="message">등록된 게임이 없습니다.</div>';
                return;
            }

            const topGames = games.slice(0, 3);
            sectionCount.textContent = `총 ${topGames.length}개의 게임`;

            topGames.forEach(function (game, index) {
                const card = document.createElement("article");
                card.className = "game-card";

                // 카드 틀 작성 (실제 이름/이미지/링크는 아래에서 JSON 값으로 삽입)
                card.innerHTML = `
                    <div class="card-cover">
                        <div class="image-fallback"></div>
                        <img class="game-image" loading="lazy">
                        <span class="rank"></span>
                    </div>
                    <div class="card-content">
                        <span class="genre"></span>
                        <h3 class="game-name"></h3>
                        <p class="game-description"></p>
                        <div class="card-actions">
                            <a class="action buy" target="_blank" rel="noopener noreferrer"></a>
                            <a class="action website" target="_blank" rel="noopener noreferrer">공식 홈페이지 ↗</a>
                        </div>
                    </div>
                `;

                card.querySelector(".rank").textContent = `0${index + 1}`;
                card.querySelector(".genre").textContent = game.genre;
                card.querySelector(".game-name").textContent = game.name;
                card.querySelector(".game-description").textContent = game.description;
                card.querySelector(".image-fallback").textContent = game.name;

                // 게임 이미지 로딩 실패 시 뒤에 있는 그라데이션과 이름이 보입니다.
                const image = card.querySelector(".game-image");
                image.alt = game.name + " 게임 이미지";
                image.addEventListener("error", function () {
                    image.classList.add("failed");
                });
                image.src = game.image;

                // PC·콘솔: 다나와 / 모바일: Google Play
                const buyLink = card.querySelector(".buy");
                buyLink.href = game.buyUrl;
                buyLink.textContent = category === "mobile" ? "설치하러 가기 ↗" : "구매하러 가기 ↗";

                // 게임 공식 홈페이지
                card.querySelector(".website").href = game.homepageUrl;

                gameGrid.appendChild(card);
            });
        }
        console.log(navButtons);
        navButtons.forEach((button) =>{
            button.addEventListener("click", () => {
                selectedCategory = button.dataset.category;

                navButtons.forEach((navButton) => {
                    // 순회하면서 클릭된 버튼 검색  ex) 콘솔 게임을 클릭했을때, button = console
                    const isSelected = (navButton === button);
                    // isSelected가 true면 추가, false면 삭제
                    // ex) 콘솔 게임을 클릭했을때, isSelected = true, 나머지 isSelected = false
                    navButton.classList.toggle("active", isSelected);
                    navButton.setAttribute("aria-pressed", String(isSelected));
                });
                renderGames(selectedCategory);
            });
        });

        loadGames();
    </script>
</body>

</html>
