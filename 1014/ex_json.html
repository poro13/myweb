<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JSON(Javascript Object Notation)</h1>
    <hr>
    <p>자바스크립트 객체 표기법</p>
    <p>자바스크립트 객체 형태의 문자열</p>
    <script>
        const obj = {
            name: 'James',
            age: 32
        };
        // JSON : 자바스크립트 객체 형태를 띈 문자열
        // 보낼때는 문자열로 변환, 받을때는 객체로 변환
        // 객체를 JSON으로 변환하기
        const str = JSON.stringify(obj); // 객체 -> 문자열
        console.log(str);

        //문자열(JSON)을 객체로 변환하기
        const result = JSON.parse(str); // 문자열 -> 객체
        console.log(result);

        const str2 = '{"no" : 1, "title": "hello"}';
        console.log(str2);
        console.log(JSON.parse(str2));
        //번호 1
        //제목 hello
    </script>
</body>
</html>
