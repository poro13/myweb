<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>클로저</h1>
    <hr>
    <p>함수는 자신이 호출된 지역이 아닌 자신이 선언된 지역(lexical scope)의 환경을 기억한다.</p>
    <script>
        function f(){
            let x = 10;
            function func(){
                return x;
            }
            return func;
        }

        let x = 100;

        const a = f();
        console.log(a);

    </script>
</body>
</html>
